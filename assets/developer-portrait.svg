<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <radialGradient id="rimLight" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Large Dark Circle Backdrop like Figma template -->
  <circle cx="300" cy="310" r="230" fill="url(#bgCircle)" stroke="#2e2e2e" stroke-width="2" />
  <circle cx="300" cy="310" r="230" fill="url(#rimLight)" />

  <!-- Subtle Orange Orbit Ring -->
  <circle cx="300" cy="310" r="245" fill="none" stroke="url(#orangeGlow)" stroke-width="1.5" stroke-dasharray="16 28" opacity="0.4" />

  <!-- Floating Tech Badges around portrait -->
  <g transform="translate(80, 160)" filter="url(#shadow)">
    <rect width="105" height="38" rx="19" fill="#1e1e1e" stroke="#ff6b00" stroke-width="1.2"/>
    <text x="52" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ff7a00" text-anchor="middle">⚡ React.js</text>
  </g>

  <g transform="translate(420, 200)" filter="url(#shadow)">
    <rect width="120" height="38" rx="19" fill="#1e1e1e" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="60" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">📱 React Native</text>
  </g>

  <g transform="translate(410, 410)" filter="url(#shadow)">
    <rect width="125" height="38" rx="19" fill="#1e1e1e" stroke="#a855f7" stroke-width="1.2"/>
    <text x="62" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">🛡️ ServiceNow</text>
  </g>

  <!-- Professional Developer Silhouette / Portrait Figure -->
  <g filter="url(#shadow)">
    <!-- Shoulders / Blazer -->
    <path d="M170 540 C 180 430, 220 370, 300 370 C 380 370, 420 430, 430 540 Z" fill="#1a1a1a" stroke="#2a2a2a" stroke-width="2" />
    
    <!-- Inner Shirt / Collar -->
    <path d="M260 370 L 300 450 L 340 370 Z" fill="#111111" />
    <path d="M300 370 L 285 430 L 300 445 L 315 430 Z" fill="#ff6b00" opacity="0.85" />
    
    <!-- Neck -->
    <rect x="278" y="295" width="44" height="85" rx="12" fill="#d4a373" />
    
    <!-- Head Base -->
    <ellipse cx="300" cy="245" rx="65" ry="78" fill="#d4a373" />
    
    <!-- Stylized Hair -->
    <path d="M225 240 C 225 160, 260 140, 300 140 C 340 140, 375 160, 375 240 C 375 260, 385 300, 375 320 C 365 300, 360 270, 360 250 C 340 210, 260 210, 240 250 C 240 270, 235 300, 225 320 Z" fill="#1f1815" />
    <path d="M235 220 C 240 150, 300 135, 300 135 C 300 135, 360 150, 365 220 C 345 180, 255 180, 235 220 Z" fill="#2d221e" />

    <!-- Sleek Tech Glasses -->
    <rect x="250" y="225" width="42" height="26" rx="6" fill="none" stroke="#ff7a00" stroke-width="2.5" />
    <rect x="308" y="225" width="42" height="26" rx="6" fill="none" stroke="#ff7a00" stroke-width="2.5" />
    <line x1="292" y1="238" x2="308" y2="238" stroke="#ff7a00" stroke-width="2.5" />

    <!-- Smile -->
    <path d="M285 285 Q 300 298 315 285" fill="none" stroke="#9c6644" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Subtle bottom fade for clean frame integration -->
  <rect x="70" y="525" width="460" height="75" fill="url(#bgCircle)" opacity="0.3" />
</svg>
