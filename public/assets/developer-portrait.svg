<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242428" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a00" />
      <stop offset="100%" stop-color="#ff5500" />
    </linearGradient>
    <radialGradient id="rimLight" cx="65%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </radialGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Large Dark Circle Backdrop matching Figma artboard -->
  <circle cx="300" cy="310" r="230" fill="url(#bgCircle)" stroke="#27272a" stroke-width="2" />
  <circle cx="300" cy="310" r="230" fill="url(#rimLight)" />

  <!-- Orbit Accent Ring -->
  <circle cx="300" cy="310" r="242" fill="none" stroke="url(#orangeGlow)" stroke-width="1.5" stroke-dasharray="14 24" opacity="0.45" />

  <!-- Floating Tech Badges -->
  <g transform="translate(65, 170)" filter="url(#cardShadow)">
    <rect width="115" height="38" rx="19" fill="#18181b" stroke="#ff6b00" stroke-width="1.2"/>
    <text x="57" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#ff7a00" text-anchor="middle">⚡ React.js</text>
  </g>

  <g transform="translate(425, 210)" filter="url(#cardShadow)">
    <rect width="125" height="38" rx="19" fill="#18181b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="62" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle">📱 React Native</text>
  </g>

  <g transform="translate(415, 410)" filter="url(#cardShadow)">
    <rect width="130" height="38" rx="19" fill="#18181b" stroke="#c084fc" stroke-width="1.2"/>
    <text x="65" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="700" fill="#c084fc" text-anchor="middle">🛡️ ServiceNow</text>
  </g>

  <!-- Professional Female Software Engineer Figure for Lakshmi Chandrakala -->
  <g filter="url(#cardShadow)">
    <!-- Back Hair flowing over shoulders -->
    <path d="M190 320 C 185 410, 210 490, 235 540 L 365 540 C 390 490, 415 410, 410 320 Z" fill="#181311" />

    <!-- Professional Blazer / Outfit in Dark Charcoal with Orange Accent -->
    <path d="M175 540 C 185 430, 225 375, 300 375 C 375 375, 415 430, 425 540 Z" fill="#1e1e24" stroke="#2e2e36" stroke-width="1.5" />
    
    <!-- Inner Silk Top with Warm Orange Hue -->
    <path d="M255 375 L 300 455 L 345 375 Z" fill="#ff6b00" opacity="0.9" />
    <path d="M275 375 L 300 425 L 325 375 Z" fill="#ff8533" />

    <!-- Graceful Neck -->
    <rect x="280" y="295" width="40" height="85" rx="14" fill="#dfa77e" />

    <!-- Head & Face -->
    <ellipse cx="300" cy="245" rx="64" ry="76" fill="#dfa77e" />

    <!-- Front Styled Long Hair -->
    <path d="M225 240 C 220 160, 255 135, 300 135 C 345 135, 380 160, 375 240 C 375 270, 385 340, 370 380 C 355 350, 355 270, 355 240 C 335 195, 265 195, 245 240 C 245 270, 245 350, 230 380 C 215 340, 225 270, 225 240 Z" fill="#1c1613" />
    
    <!-- Soft Hair Highlights -->
    <path d="M240 215 C 255 160, 300 150, 300 150 C 300 150, 345 160, 360 215 C 345 180, 255 180, 240 215 Z" fill="#2d231e" />

    <!-- Delicate Earrings -->
    <circle cx="234" cy="265" r="4" fill="#ff7a00" />
    <circle cx="366" cy="265" r="4" fill="#ff7a00" />

    <!-- Gentle Friendly Smile -->
    <path d="M284 285 Q 300 298 316 285" fill="none" stroke="#a46845" stroke-width="2.5" stroke-linecap="round" />

    <!-- Expressive Eyes -->
    <ellipse cx="276" cy="240" rx="6" ry="7" fill="#261b17" />
    <ellipse cx="324" cy="240" rx="6" ry="7" fill="#261b17" />
    <circle cx="278" cy="238" r="2" fill="#ffffff" />
    <circle cx="326" cy="238" r="2" fill="#ffffff" />
    
    <!-- Eyebrows -->
    <path d="M266 226 Q 278 221 288 226" fill="none" stroke="#261b17" stroke-width="2.5" stroke-linecap="round" />
    <path d="M312 226 Q 322 221 334 226" fill="none" stroke="#261b17" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Soft Blend -->
  <rect x="70" y="530" width="460" height="70" fill="url(#bgCircle)" opacity="0.3" />
</svg>
